<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الأنشودة | نَدى</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
<style id="nada-geometric-heritage">

/* NADA Geometric Heritage — visual layer only */
:root{
  --g:#0b5d4b;--g2:#08463a;--iv:#fbf8ef;--au:#b8975a;
  --tx:#1d2b27;--mu:#64756f;--bd:#e6dfcc;
  --surface:rgba(255,255,255,.88);--shadow:0 14px 40px rgba(8,70,58,.09);
  --shadow-hover:0 20px 48px rgba(8,70,58,.15);--radius:22px;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at 0% 0%,rgba(184,151,90,.10),transparent 32rem),
    radial-gradient(ellipse at 100% 10%,rgba(11,93,75,.09),transparent 34rem),
    var(--iv)!important;
  color:var(--tx);font-family:"Cairo",Tahoma,Arial,sans-serif;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.20;
  background-image:url("data:image/svg+xml,%3Csvg width='96' height='96' viewBox='0 0 96 96' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23b8975a' stroke-opacity='.30' stroke-width='.7'%3E%3Cpath d='M48 3 61 16 80 16 80 35 93 48 80 61 80 80 61 80 48 93 35 80 16 80 16 61 3 48 16 35 16 16 35 16Z'/%3E%3Cpath d='M48 18 59 29 67 29 67 37 78 48 67 59 67 67 59 67 48 78 37 67 29 67 29 59 18 48 29 37 29 29 37 29Z'/%3E%3C/g%3E%3C/svg%3E");
}
.top, .topbar{
  background:linear-gradient(115deg,#073e33 0%,#0b5d4b 58%,#124f40 100%)!important;
  color:#fff!important;border:0!important;box-shadow:0 8px 30px rgba(8,70,58,.14);
  position:relative;
}
.top:after,.topbar:after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.13;
  background-image:repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,255,255,.2) 23px,transparent 24px 46px);
}
.brand,.brand b,.topbar .brand{color:#fff!important;position:relative;z-index:1}
.brand small{color:#e7d4a5!important}
.top-actions,.top-link{position:relative;z-index:1}
.top-actions>span{color:#f7f2e6}
.wrap{max-width:1180px!important;margin:34px auto!important;padding-left:22px!important;padding-right:22px!important}
.page-title{margin-bottom:26px!important}
h1{letter-spacing:-.035em;color:var(--g)}
h2,h3{letter-spacing:-.02em}
.eyebrow{letter-spacing:.02em}
.card,.action-card{
  background:var(--surface)!important;border:1px solid rgba(184,151,90,.25)!important;
  border-radius:var(--radius)!important;box-shadow:var(--shadow)!important;
  backdrop-filter:blur(10px);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
  position:relative;overflow:hidden;
}
.card:before,.action-card:before{
  content:"";position:absolute;top:0;right:22px;width:54px;height:3px;
  background:linear-gradient(90deg,var(--au),#e4d4a8);border-radius:0 0 8px 8px;opacity:.8;
}
.card:hover,.action-card:hover{box-shadow:var(--shadow-hover)!important;border-color:rgba(184,151,90,.48)!important}
.grid{gap:18px!important}
.btn,.btn-light,.top-link,button{
  border-radius:13px;transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}
.btn{
  background:linear-gradient(135deg,var(--g),var(--g2))!important;color:#fff!important;
  box-shadow:0 5px 13px rgba(11,93,75,.14);font-weight:700;
}
.btn:hover,button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(11,93,75,.16)}
.btn.light,.btn-light{
  background:rgba(255,255,255,.82)!important;color:var(--g)!important;
  border:1px solid rgba(184,151,90,.38)!important;box-shadow:none;
}
.btn.light:hover,.btn-light:hover{background:#f3eee0!important}
input,textarea,select{
  border:1px solid #ded7c5!important;border-radius:13px!important;background:rgba(255,255,255,.92)!important;
  color:var(--tx)!important;outline:none;transition:border-color .18s,box-shadow .18s;
}
input:focus,textarea:focus,select:focus{border-color:var(--g)!important;box-shadow:0 0 0 4px rgba(11,93,75,.09)}
.badge,.room-status{background:#e7f1eb!important;color:#0b5d4b!important;border:1px solid #d1e4d8}
.empty{background:rgba(255,255,255,.76)!important;border:1px dashed rgba(184,151,90,.6)!important;border-radius:18px!important}
.lyrics{background:rgba(255,255,255,.88)!important;border:1px solid rgba(184,151,90,.28)!important;border-radius:22px!important;box-shadow:var(--shadow);padding:clamp(20px,4vw,34px)!important}
.toast{box-shadow:0 12px 32px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.25)}
a:focus-visible,button:focus-visible{outline:3px solid #d9bc7b;outline-offset:3px}
::selection{background:#d9e9df;color:#08463a}
@media(max-width:700px){
  .wrap{margin:22px auto!important;padding-left:14px!important;padding-right:14px!important}
  .top,.topbar{padding:14px 16px!important}
  .top-actions{gap:8px!important}
  .top-actions .btn,.top-actions .top-link{font-size:.88rem;padding:8px 11px}
  .card,.action-card{border-radius:18px!important;padding:17px!important}
  .page-title{gap:10px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

</style>
</head>

<body>
  <div id="app">جارٍ تحميل الأنشودة...</div>

  <script>
  (async () => {
    let ctx = null;

const { data: { session } } = await db.auth.getSession();

if (session) {
  ctx = await requireSession();
}

const id = new URLSearchParams(location.search).get('id');

    if (!id) {
      location.replace('library.html');
      return;
    }

    const { data: n, error } = await db
      .from('anasheed')
      .select('*')
      .eq('id', id)
      .single();

    if (error || !n) {
      document.getElementById('app').innerHTML =
        styles() +
        '<main class="wrap"><div class="empty">الأنشودة غير موجودة أو لا تملك صلاحية عرضها.</div><a class="btn" href="library.html">العودة للفهرس</a></main>';
      return;
    }

const room = ctx ? selectedRoomId() : null;
const isAdmin = ctx?.account?.role === 'admin';
const isLeader = ctx?.account?.role === 'leader';

    document.getElementById('app').innerHTML =
      styles() +
      commonHeader(n.title, ctx?.account || null) +
      `
      <p class="muted" id="category">${escapeHtml(n.category || 'بدون تصنيف')}</p>

      <article id="lyrics" class="lyrics"></article>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        <button class="btn light" id="copy" type="button">نسخ الكلمات</button>

        <a class="btn light" href="library.html${room ? '?room=' + encodeURIComponent(room) : ''}">
          العودة للفهرس
        </a>

        ${isAdmin ? `
          <button class="btn" id="edit" type="button">تعديل الأنشودة</button>
          <button class="btn light" id="delete" type="button">حذف الأنشودة</button>
        ` : ''}

        ${(isLeader || isAdmin) && room ? `
          <button class="btn" id="select" type="button">اعتماد الأنشودة للفرقة</button>
        ` : ''}
      </div>

      ${isAdmin ? `
        <section id="editBox" class="card" hidden style="margin-top:22px">
          <h2>تعديل الأنشودة</h2>

          <form id="editForm">
            <label for="editTitle">عنوان الأنشودة</label>
            <input id="editTitle" maxlength="250" required>

            <label for="editCategory">التصنيف</label>
            <input id="editCategory" maxlength="150">

            <label for="editContent">كلمات الأنشودة</label>
            <textarea id="editContent" required></textarea>

            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <button class="btn" id="saveEdit" type="submit">حفظ التعديلات</button>
              <button class="btn light" id="cancelEdit" type="button">إلغاء</button>
            </div>
          </form>
        </section>
      ` : ''}

      </main>`;

    document.getElementById('lyrics').textContent = n.content || '';

    // نسخ الكلمات
    document.getElementById('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(n.content || '');
        toast('تم نسخ الكلمات');
      } catch (e) {
        console.error(e);
        toast('تعذّر النسخ؛ انسخ النص يدويًا', true);
      }
    };

    // وظائف المدير فقط
    if (isAdmin) {
      const editBox = document.getElementById('editBox');
      const editForm = document.getElementById('editForm');

      // فتح نموذج التعديل
      document.getElementById('edit').onclick = () => {
        document.getElementById('editTitle').value = n.title || '';
        document.getElementById('editCategory').value = n.category || '';
        document.getElementById('editContent').value = n.content || '';

        editBox.hidden = false;
        editBox.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
      };

      // إلغاء التعديل
      document.getElementById('cancelEdit').onclick = () => {
        editBox.hidden = true;
        editForm.reset();
      };

      // حفظ التعديلات
      editForm.onsubmit = async (e) => {
        e.preventDefault();

        const btn = document.getElementById('saveEdit');
        const title = document.getElementById('editTitle').value.trim();
        const category = document.getElementById('editCategory').value.trim();
        const content = document.getElementById('editContent').value.trim();

        if (!title || !content) {
          toast('العنوان والكلمات مطلوبان', true);
          return;
        }

        btn.disabled = true;

        try {
          const { data, error } = await db
            .from('anasheed')
            .update({
              title,
              category: category || null,
              content,
              updated_at: new Date().toISOString()
            })
            .eq('id', id)
            .select('id');

          if (error) throw error;

          if (!data || data.length === 0) {
            throw new Error('لم يتم تحديث أي سجل؛ تحقق من صلاحيات التعديل في قاعدة البيانات.');
          }

          n.title = title;
          n.category = category || null;
          n.content = content;

          const pageTitle = document.querySelector('.page-title h1');
          if (pageTitle) pageTitle.textContent = title;

          document.getElementById('category').textContent =
            category || 'بدون تصنيف';

          document.getElementById('lyrics').textContent = content;
          document.title = title + ' | نَدى';

          editBox.hidden = true;
          toast('تم حفظ التعديلات بنجاح');
        } catch (err) {
          console.error('خطأ تعديل الأنشودة:', err);
          toast('تعذّر التعديل؛ تحقق من صلاحيات المدير وسياسات قاعدة البيانات.', true);
        } finally {
          btn.disabled = false;
        }
      };

      // حذف الأنشودة دون رسالة تأكيد
      // يمنع حذف أنشودة معتمدة في أي غرفة
      document.getElementById('delete').onclick = async () => {
        const btn = document.getElementById('delete');
        btn.disabled = true;

        try {
          const { data: active, error: activeError } = await db
            .from('active_selections')
            .select('room_id')
            .eq('nasheed_id', id);

          if (activeError) throw activeError;

          if (active && active.length > 0) {
            toast(
              'لا يمكن حذف الأنشودة لأنها معتمدة في غرفة أو أكثر. ألغِ اعتمادها أولًا.',
              true
            );
            return;
          }

          const { data: deleted, error: deleteError } = await db
            .from('anasheed')
            .delete()
            .eq('id', id)
            .select('id');

          if (deleteError) throw deleteError;

          if (!deleted || deleted.length === 0) {
            throw new Error('لم يتم حذف أي سجل. تحقق من سياسة DELETE وصلاحيات المدير في Supabase.');
          }

          toast('تم حذف الأنشودة');

          setTimeout(() => {
            location.replace(
              'library.html' +
              (room ? '?room=' + encodeURIComponent(room) : '')
            );
          }, 700);

        } catch (err) {
          console.error('خطأ حذف الأنشودة:', err);
          toast(
            'تعذّر الحذف. افتح Console لمعرفة الخطأ؛ قد تكون المشكلة من الصلاحيات أو ارتباط الأنشودة بسجلات أخرى.',
            true
          );
        } finally {
          btn.disabled = false;
        }
      };
    }

    // اعتماد الأنشودة للقائد والمدير عند وجود غرفة مختارة
    const s = document.getElementById('select');

    if (s) {
      s.onclick = async () => {
        s.disabled = true;
        s.textContent = 'جارٍ الاعتماد...';

        try {
          const { error } = await db.rpc(
            'select_nasheed_for_room',
            {
              p_room_id: room,
              p_nasheed_id: n.id
            }
          );

          if (error) {
            console.error('خطأ اعتماد الأنشودة:', error);
            toast(
              'لم يتم الاعتماد. تحقق من صلاحيات الحساب ودالة قاعدة البيانات.',
              true
            );
          } else {
            toast('تم اعتماد الأنشودة بنجاح');
          }
        } catch (e) {
          console.error('خطأ غير متوقع أثناء الاعتماد:', e);
          toast('حدث خطأ أثناء اعتماد الأنشودة.', true);
        } finally {
          s.disabled = false;
          s.textContent = 'اعتماد الأنشودة للفرقة';
        }
      };
    }
  })();
  </script>
</body>
</html>

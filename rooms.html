
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>غرف الإنشاد | نَدى</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>

  <style>
    /* =====================================
       ROOM FORM & BASIC COMPONENTS
    ===================================== */

    .room-form {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .room-form input,
    .room-form textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d8dfd7;
      border-radius: 10px;
      font: inherit;
      background: #fff;
      color: #173d32;
    }

    .room-form textarea {
      min-height: 80px;
      resize: vertical;
    }

    .room-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .btn.danger {
      background: #a93636;
      color: white;
      border: none;
    }

    .btn.warning {
      background: #f4e7c8;
      color: #684b13;
      border: none;
    }

    .room-status {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #e5f3e9;
      color: #176344;
      font-size: 13px;
    }

    .room-status.off {
      background: #f8e5e3;
      color: #9b302b;
    }

    .admin-tools {
      margin-bottom: 22px;
    }

    .section-title {
      margin-bottom: 8px;
    }

    /* =====================================
       NADA - GEOMETRIC HERITAGE DESIGN
    ===================================== */

    :root {
      --g: #0b5d4b;
      --g2: #08463a;
      --iv: #fbf8ef;
      --au: #b8975a;
      --tx: #1d2b27;
      --mu: #64756f;
      --bd: #e6dfcc;
      --surface: rgba(255,255,255,.88);
      --shadow: 0 14px 40px rgba(8,70,58,.09);
      --shadow-hover: 0 20px 48px rgba(8,70,58,.15);
      --radius: 22px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(ellipse at 0% 0%,rgba(184,151,90,.10),transparent 32rem),
        radial-gradient(ellipse at 100% 10%,rgba(11,93,75,.09),transparent 34rem),
        var(--iv) !important;

      color: var(--tx);
      font-family: "Cairo",Tahoma,Arial,sans-serif;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .20;

      background-image: url("data:image/svg+xml,%3Csvg width='96' height='96' viewBox='0 0 96 96' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23b8975a' stroke-opacity='.30' stroke-width='.7'%3E%3Cpath d='M48 3 61 16 80 16 80 35 93 48 80 61 80 80 61 80 48 93 35 80 16 80 16 61 3 48 16 35 16 16 35 16Z'/%3E%3Cpath d='M48 18 59 29 67 29 67 37 78 48 67 59 67 67 59 67 48 78 37 67 29 67 29 59 18 48 29 37 29 29 37 29Z'/%3E%3C/g%3E%3C/svg%3E");
    }

    /* Header */

    .top,
    .topbar {
      background: linear-gradient(
        115deg,
        #073e33 0%,
        #0b5d4b 58%,
        #124f40 100%
      ) !important;

      color: #fff !important;
      border: 0 !important;
      box-shadow: 0 8px 30px rgba(8,70,58,.14);
      position: relative;
    }

    .top:after,
    .topbar:after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .13;

      background-image: repeating-linear-gradient(
        45deg,
        transparent 0 22px,
        rgba(255,255,255,.2) 23px,
        transparent 24px 46px
      );
    }

    .brand,
    .brand b,
    .topbar .brand {
      color: #fff !important;
      position: relative;
      z-index: 1;
    }

    .brand small {
      color: #e7d4a5 !important;
    }

    .top-actions,
    .top-link {
      position: relative;
      z-index: 1;
    }

    .top-actions > span {
      color: #f7f2e6;
    }

    /* Layout */

    .wrap {
      max-width: 1180px !important;
      margin: 34px auto !important;
      padding-left: 22px !important;
      padding-right: 22px !important;
    }

    .page-title {
      margin-bottom: 26px !important;
    }

    h1 {
      letter-spacing: -.035em;
      color: var(--g);
    }

    h2,
    h3 {
      letter-spacing: -.02em;
    }

    .eyebrow {
      letter-spacing: .02em;
    }

    /* Cards */

    .card,
    .action-card {
      background: var(--surface) !important;
      border: 1px solid rgba(184,151,90,.25) !important;
      border-radius: var(--radius) !important;
      box-shadow: var(--shadow) !important;
      backdrop-filter: blur(10px);

      transition:
        transform .22s ease,
        box-shadow .22s ease,
        border-color .22s ease;

      position: relative;
      overflow: hidden;
    }

    .card:before,
    .action-card:before {
      content: "";
      position: absolute;
      top: 0;
      right: 22px;
      width: 54px;
      height: 3px;

      background: linear-gradient(90deg,var(--au),#e4d4a8);
      border-radius: 0 0 8px 8px;
      opacity: .8;
    }

    .card:hover,
    .action-card:hover {
      box-shadow: var(--shadow-hover) !important;
      border-color: rgba(184,151,90,.48) !important;
    }

    .grid {
      gap: 18px !important;
    }

    /* =====================================
       ROOM ICONS
    ===================================== */

    .room-topline {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .room-icon {
      width: 70px;
      height: 70px;
      flex: 0 0 70px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 21px;
      border: 1px solid;

      transition: transform .25s ease, box-shadow .25s ease;
    }

    .room-icon svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .room-icon-0 {
      color: #167653;
      background: linear-gradient(145deg,#e0f2e7,#c5e7d3);
      border-color: #a5d2b7;
    }

    .room-icon-1 {
      color: #a17a30;
      background: linear-gradient(145deg,#f8efd8,#ead8a9);
      border-color: #dbc48c;
    }

    .room-icon-2 {
      color: #477e88;
      background: linear-gradient(145deg,#e0f0ef,#c4e1df);
      border-color: #a8cfca;
    }

    .room-meta {
      min-width: 0;
    }

    .room-meta h2 {
      margin: 8px 0 0;
    }

    .card:hover .room-icon {
      transform: translateY(-3px);
    }

    /* Buttons */

    .btn,
    .btn-light,
    .top-link,
    button {
      border-radius: 13px;

      transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }

    .btn {
      background: linear-gradient(135deg,var(--g),var(--g2)) !important;
      color: #fff !important;
      box-shadow: 0 5px 13px rgba(11,93,75,.14);
      font-weight: 700;
    }

    .btn:hover,
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(11,93,75,.16);
    }

    .btn.light,
    .btn-light {
      background: rgba(255,255,255,.82) !important;
      color: var(--g) !important;
      border: 1px solid rgba(184,151,90,.38) !important;
      box-shadow: none;
    }

    .btn.light:hover,
    .btn-light:hover {
      background: #f3eee0 !important;
    }

    /* Inputs */

    input,
    textarea,
    select {
      border: 1px solid #ded7c5 !important;
      border-radius: 13px !important;
      background: rgba(255,255,255,.92) !important;
      color: var(--tx) !important;
      outline: none;

      transition: border-color .18s,box-shadow .18s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--g) !important;
      box-shadow: 0 0 0 4px rgba(11,93,75,.09);
    }

    /* Status */

    .badge,
    .room-status {
      background: #e7f1eb !important;
      color: #0b5d4b !important;
      border: 1px solid #d1e4d8;
    }

    .room-status.off {
      background: #f8e5e3 !important;
      color: #9b302b !important;
    }

    /* Empty state */

    .empty {
      background: rgba(255,255,255,.76) !important;
      border: 1px dashed rgba(184,151,90,.6) !important;
      border-radius: 18px !important;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid #d9bc7b;
      outline-offset: 3px;
    }

    ::selection {
      background: #d9e9df;
      color: #08463a;
    }

    /* =====================================
       COMPLETE DARK MODE
    ===================================== */

    html[data-theme="dark"] {
      color-scheme: dark;
    }

    /* General background */

    html[data-theme="dark"] body {
      background:
        radial-gradient(
          ellipse at 0% 0%,
          rgba(184,151,90,.09),
          transparent 32rem
        ),
        radial-gradient(
          ellipse at 100% 10%,
          rgba(40,120,85,.10),
          transparent 34rem
        ),
        #101a15 !important;

      color: #e8e9df !important;
    }

    html[data-theme="dark"] body:before {
      opacity: .12;
    }

    /* Header */

    html[data-theme="dark"] .top,
    html[data-theme="dark"] .topbar {
      background: linear-gradient(
        115deg,
        #073e33,
        #0b5d4b 58%,
        #124f40
      ) !important;

      color: #fff !important;
    }

    /* Main headings */

    html[data-theme="dark"] h1,
    html[data-theme="dark"] h2 {
      color: #dfc991 !important;
    }

    html[data-theme="dark"] h3 {
      color: #e8e9df !important;
    }

    /* Main room cards */

    html[data-theme="dark"] #rooms > .card,
    html[data-theme="dark"] .admin-tools {
      background: linear-gradient(
        145deg,
        #1b2b22,
        #142019
      ) !important;

      border: 1px solid #405b49 !important;
      color: #e8e9df !important;

      box-shadow: 0 14px 38px rgba(0,0,0,.25) !important;
    }

    html[data-theme="dark"] #rooms > .card:hover,
    html[data-theme="dark"] .admin-tools:hover {
      border-color: #66866a !important;
      box-shadow: 0 18px 42px rgba(0,0,0,.35) !important;
    }

    /* Golden card decoration */

    html[data-theme="dark"] .card:before,
    html[data-theme="dark"] .action-card:before {
      background: linear-gradient(
        90deg,
        #b8975a,
        #e4d4a8
      );
    }

    /* Secondary text */

    html[data-theme="dark"] .muted {
      color: #a5b5a8 !important;
    }

    html[data-theme="dark"] .eyebrow {
      color: #c9aa69 !important;
    }

    /* Room information */

    html[data-theme="dark"] .room-topline {
      color: #e8e9df !important;
    }

    html[data-theme="dark"] .room-meta h2 {
      color: #e7d5a7 !important;
    }

    /* Room status: active */

    html[data-theme="dark"] .room-status:not(.off),
    html[data-theme="dark"] .badge {
      background: #244b36 !important;
      color: #a9e3bb !important;
      border: 1px solid #426e50 !important;
    }

    /* Room status: inactive */

    html[data-theme="dark"] .room-status.off {
      background: #492b2b !important;
      color: #ffb9b0 !important;
      border: 1px solid #754343 !important;
    }

    /* Room icons */

    html[data-theme="dark"] .room-icon-0 {
      color: #83e0b2 !important;
      background: linear-gradient(
        145deg,
        #194c38,
        #235d43
      ) !important;
      border-color: #39835e !important;
      box-shadow: 0 0 22px rgba(89,207,146,.12);
    }

    html[data-theme="dark"] .room-icon-1 {
      color: #f0cd7d !important;
      background: linear-gradient(
        145deg,
        #493b22,
        #5b4928
      ) !important;
      border-color: #917342 !important;
      box-shadow: 0 0 22px rgba(231,192,104,.13);
    }

    html[data-theme="dark"] .room-icon-2 {
      color: #8bd6d5 !important;
      background: linear-gradient(
        145deg,
        #1d4140,
        #285655
      ) !important;
      border-color: #417c78 !important;
      box-shadow: 0 0 22px rgba(103,205,198,.12);
    }

    html[data-theme="dark"] .card:hover .room-icon {
      box-shadow: 0 0 26px rgba(185,154,91,.22);
    }

    /* Current nasheed inner card */

    html[data-theme="dark"] #rooms > .card .card {
      background: linear-gradient(
        145deg,
        #20372a,
        #192c21
      ) !important;

      border: 1px solid #49644d !important;
      color: #e8e9df !important;

      box-shadow: inset 0 1px 0 rgba(255,255,255,.025) !important;
    }

    html[data-theme="dark"] #rooms > .card .card h3 {
      color: #e7d5a7 !important;
    }

    html[data-theme="dark"] #rooms > .card .card .eyebrow {
      color: #d0b579 !important;
    }

    /* Admin tools */

    html[data-theme="dark"] .admin-tools h2 {
      color: #e7d5a7 !important;
    }

    html[data-theme="dark"] .admin-tools p {
      color: #b5c2b9 !important;
    }

    /* Room form */

    html[data-theme="dark"] .room-form {
      gap: 14px;
    }

    html[data-theme="dark"] .room-form input,
    html[data-theme="dark"] .room-form textarea {
      background: #192b21 !important;
      color: #edf3ed !important;
      border: 1px solid #526b58 !important;
      border-radius: 13px !important;

      box-shadow: inset 0 2px 5px rgba(0,0,0,.12) !important;
    }

    html[data-theme="dark"] .room-form input::placeholder,
    html[data-theme="dark"] .room-form textarea::placeholder {
      color: #899c8e !important;
    }

    html[data-theme="dark"] .room-form input:focus,
    html[data-theme="dark"] .room-form textarea:focus {
      background: #20382a !important;
      border-color: #83c99b !important;
      box-shadow: 0 0 0 4px rgba(86,185,154,.13) !important;
    }

    /* Main buttons */

    html[data-theme="dark"] .btn:not(.light):not(.warning):not(.danger) {
      background: linear-gradient(
        135deg,
        #267653,
        #10513b
      ) !important;

      color: #fff !important;
      border: 1px solid #477c5b !important;
    }

    /* Secondary buttons */

    html[data-theme="dark"] .btn.light,
    html[data-theme="dark"] .btn-light {
      background: #203b2c !important;
      color: #b9e4c8 !important;
      border: 1px solid #52785b !important;
      box-shadow: none !important;
    }

    html[data-theme="dark"] .btn.light:hover,
    html[data-theme="dark"] .btn-light:hover {
      background: #2b5039 !important;
      color: #fff !important;
    }

    /* Warning button */

    html[data-theme="dark"] .btn.warning {
      background: #554321 !important;
      color: #f2d38b !important;
      border: 1px solid #806638 !important;
    }

    /* Danger button */

    html[data-theme="dark"] .btn.danger {
      background: #512c2c !important;
      color: #ffc0b8 !important;
      border: 1px solid #824747 !important;
    }

    /* Disabled buttons */

    html[data-theme="dark"] button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Empty state */

    html[data-theme="dark"] .empty {
      background: #1b2b22 !important;
      color: #c7d5ca !important;
      border: 1px dashed #806c43 !important;
    }

    /* Selection */

    html[data-theme="dark"] ::selection {
      background: #35694b;
      color: #fff;
    }

    /* Scrollbar */

    html[data-theme="dark"] * {
      scrollbar-color: #496b53 #15231b;
    }

    /* =====================================
       RESPONSIVE DESIGN
    ===================================== */

    @media (max-width: 700px) {
      .wrap {
        margin: 22px auto !important;
        padding-left: 14px !important;
        padding-right: 14px !important;
      }

      .top,
      .topbar {
        padding: 14px 16px !important;
      }

      .top-actions {
        gap: 8px !important;
      }

      .top-actions .btn,
      .top-actions .top-link {
        font-size: .88rem;
        padding: 8px 11px;
      }

      .card,
      .action-card {
        border-radius: 18px !important;
        padding: 17px !important;
      }

      .page-title {
        gap: 10px;
      }

      html[data-theme="dark"] #rooms > .card,
      html[data-theme="dark"] .admin-tools {
        border-radius: 18px !important;
      }
    }

    @media (max-width: 500px) {
      .room-icon {
        width: 58px;
        height: 58px;
        flex-basis: 58px;
        border-radius: 17px;
      }

      .room-icon svg {
        width: 29px;
        height: 29px;
      }

      .room-topline {
        gap: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *:before,
      *:after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">جارٍ تحميل الغرف...</div>

  <script>
    (async () => {
      const app = document.getElementById('app');

      try {
        const ctx = await requireSession();

        // إذا لم توجد جلسة صالحة، انتقل إلى صفحة تسجيل الدخول.
        if (!ctx || !ctx.account) {
          window.location.replace('index.html?login=1&next=rooms.html');
          return;
        }

        const isAdmin = ctx.account.role === 'admin';
        const isLeader = ctx.account.role === 'leader';

        app.innerHTML =
          styles() +
          commonHeader('غرف الإنشاد', ctx.account) +
          `
            <section id="adminTools" class="card admin-tools" hidden>
              <h2 class="section-title">إدارة غرف الإنشاد</h2>

              <p class="muted">
                أضف الغرف وعدّل بياناتها أو عطّلها وقت ما بدك.
              </p>

              <form id="addRoomForm" class="room-form">
                <input
                  id="roomName"
                  type="text"
                  maxlength="120"
                  placeholder="اسم الغرفة أو الفرقة"
                  required
                >

                <textarea
                  id="roomDescription"
                  maxlength="500"
                  placeholder="وصف الغرفة (اختياري)"
                ></textarea>

                <button class="btn" type="submit">
                  إضافة غرفة جديدة
                </button>
              </form>
            </section>

            <section id="rooms" class="grid"></section>
          </main>
          `;

        const target = document.getElementById('rooms');
        const adminTools = document.getElementById('adminTools');

        if (isAdmin) {
          adminTools.hidden = false;
        }

        let rooms = [];
        let selections = [];
        let selectionError = false;

        const page =
          isLeader ? 'leader.html' :
          isAdmin ? 'admin.html' :
          'member.html';

        async function loadRooms() {
          target.innerHTML =
            '<div class="empty">جارٍ تحميل الغرف...</div>';

          if (isAdmin) {
            const { data, error } = await db
              .from('rooms')
              .select('id, name, description, is_active, created_at')
              .order('created_at', { ascending: true });

            if (error) throw error;

            rooms = data || [];

          } else {
            rooms = await getAllowedRooms(ctx.account.id);
          }

          selections = [];
          selectionError = false;

          if (rooms.length) {
            const { data, error } = await db
              .from('active_selections')
              .select('room_id, nasheed_id, anasheed(title)')
              .in('room_id', rooms.map(r => r.id));

            if (error) {
              console.error('خطأ تحميل الأناشيد النشطة:', error);

              selectionError = true;

              toast(
                'تعذّر تحميل الأناشيد الحالية. تحقق من صلاحيات القراءة.',
                true
              );

            } else {
              selections = data || [];
            }
          }

          renderRooms();
        }

        function renderRooms() {
          if (!rooms.length) {
            target.innerHTML = `
              <div class="empty">
                ${isAdmin
                  ? 'ما في غرف حاليًا. تقدر تضيف أول غرفة من النموذج أعلاه.'
                  : 'لا توجد غرف متاحة لهذا الحساب.'}
              </div>
            `;
            return;
          }

          target.innerHTML = rooms.map((r, index) => {
            const selection = selections.find(
              x => x.room_id === r.id
            );

            const title = selectionError
              ? 'تعذّر تحميل الأنشودة الحالية'
              : selection?.anasheed?.title || 'لا توجد أنشودة مختارة';

            const hasSelection = !selectionError && !!selection;

            return `
              <article class="card">

                <div class="room-topline">

                  <div
                    class="room-icon room-icon-${index % 3}"
                    aria-hidden="true"
                  >
                    <svg viewBox="0 0 24 24">
                      <path d="M9 18V5l12-2v13"/>
                      <circle cx="6" cy="18" r="3"/>
                      <circle cx="18" cy="16" r="3"/>
                    </svg>
                  </div>

                  <div class="room-meta">

                    ${isAdmin ? `
                      <span class="room-status ${r.is_active ? '' : 'off'}">
                        ${r.is_active ? 'الغرفة مفعّلة' : 'الغرفة معطّلة'}
                      </span>
                    ` : `
                      <span class="badge">
                        ${selectionError
                          ? 'تعذّر تحميل الحالة'
                          : hasSelection
                            ? 'توجد أنشودة مختارة'
                            : 'بانتظار اختيار أنشودة'}
                      </span>
                    `}

                    <h2>${escapeHtml(r.name)}</h2>

                  </div>
                </div>

                <h2>${escapeHtml(r.name)}</h2>

                <p class="muted">
                  ${escapeHtml(
                    r.description || 'مساحة مخصصة لفريق الإنشاد'
                  )}
                </p>

                <div class="card">
                  <p class="eyebrow">الأنشودة الحالية</p>
                  <h3>${escapeHtml(title)}</h3>
                </div>

                <div class="room-actions">

                  ${r.is_active ? `
                    <a
                      class="btn"
                      href="${page}?room=${encodeURIComponent(r.id)}"
                    >دخول الغرفة</a>

                    ${(isAdmin || isLeader) ? `
                      <a
                        class="btn light"
                        href="library.html?room=${encodeURIComponent(r.id)}"
                      >تغيير الأنشودة</a>
                    ` : ''}
                  ` : ''}

                  ${isAdmin ? `
                    <button
                      class="btn light"
                      type="button"
                      data-action="edit"
                      data-id="${r.id}"
                    >تعديل البيانات</button>

                    <button
                      class="btn warning"
                      type="button"
                      data-action="toggle"
                      data-id="${r.id}"
                    >${r.is_active ? 'تعطيل الغرفة' : 'تفعيل الغرفة'}</button>

                    <button
                      class="btn danger"
                      type="button"
                      data-action="delete"
                      data-id="${r.id}"
                    >حذف نهائي</button>
                  ` : ''}

                </div>
              </article>
            `;
          }).join('');
        }

        // إضافة غرفة جديدة
        if (isAdmin) {
          document
            .getElementById('addRoomForm')
            .addEventListener('submit', async e => {
              e.preventDefault();

              const name = document
                .getElementById('roomName')
                .value.trim();

              const description = document
                .getElementById('roomDescription')
                .value.trim();

              const submitButton = e.submitter;

              if (!name) {
                toast('اكتب اسم الغرفة أولًا.', true);
                return;
              }

              submitButton.disabled = true;

              try {
                const { error } = await db
                  .from('rooms')
                  .insert({
                    name,
                    description: description || null,
                    is_active: true
                  });

                if (error) throw error;

                e.target.reset();

                toast('تمت إضافة الغرفة بنجاح.');

                await loadRooms();

              } catch (error) {
                console.error('خطأ إضافة الغرفة:', error);

                toast(
                  'تعذّرت إضافة الغرفة: ' + error.message,
                  true
                );

              } finally {
                submitButton.disabled = false;
              }
            });

          // تعديل البيانات، تفعيل وتعطيل الغرفة، أو حذفها
          target.addEventListener('click', async e => {
            const button = e.target.closest('button[data-action]');

            if (!button) return;

            const room = rooms.find(
              r => r.id === button.dataset.id
            );

            if (!room) return;

            const action = button.dataset.action;
            let updateData = null;

            if (action === 'edit') {
              const name = prompt(
                'اكتب اسم الغرفة:',
                room.name
              );

              if (name === null) return;

              if (!name.trim()) {
                toast(
                  'اسم الغرفة لا يمكن أن يكون فارغًا.',
                  true
                );
                return;
              }

              const description = prompt(
                'اكتب وصف الغرفة (اتركه فارغًا إذا ما بدك وصفًا):',
                room.description || ''
              );

              if (description === null) return;

              updateData = {
                name: name.trim(),
                description: description.trim() || null
              };
            }

            if (action === 'toggle') {
              updateData = {
                is_active: !room.is_active
              };
            }

            button.disabled = true;

            try {
              if (action === 'edit' || action === 'toggle') {
                const { error } = await db
                  .from('rooms')
                  .update(updateData)
                  .eq('id', room.id);

                if (error) throw error;

                toast(
                  action === 'toggle'
                    ? (
                        updateData.is_active
                          ? 'تم تفعيل الغرفة.'
                          : 'تم تعطيل الغرفة.'
                      )
                    : 'تم تحديث الغرفة بنجاح.'
                );

                await loadRooms();
              }

              if (action === 'delete') {
               

                if (!confirmed) return;

                const { error } = await db
                  .from('rooms')
                  .delete()
                  .eq('id', room.id);

                if (error) throw error;

                toast('تم حذف الغرفة نهائيًا.');

                await loadRooms();
              }

            } catch (error) {
              console.error('خطأ إدارة الغرفة:', error);

              toast(
                'تعذّر تنفيذ العملية: ' + error.message,
                true
              );

            } finally {
              button.disabled = false;
            }
          });
        }

        await loadRooms();

      } catch (e) {
        console.error('خطأ صفحة الغرف:', e);

        // إذا فشل التحقق من الجلسة، ارجع لتسجيل الدخول.
        const message = String(e?.message || '').toLowerCase();

        const sessionError =
          message.includes('session') ||
          message.includes('جلسة') ||
          message.includes('غير موجودة') ||
          message.includes('unauthenticated');

        if (sessionError) {
          window.location.replace('index.html?login=1&next=rooms.html');
          return;
        }

        app.innerHTML =
          styles() +
          `
            <main class="wrap">
              <div class="empty">
                تعذّر تحميل الغرف. تحقق من الاتصال وصلاحيات الحساب،
                وافتح Console لمعرفة تفاصيل الخطأ.
              </div>

              <button class="btn" id="retryRooms" type="button">
                إعادة المحاولة
              </button>
            </main>
          `;

        document.getElementById('retryRooms').onclick = () => {
          location.reload();
        };
      }
    })();
  </script>
</body>
</html>

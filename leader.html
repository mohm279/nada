<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة القائد | نَدى</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>
<style id="nada-geometric-heritage">

/* NADA Geometric Heritage — visual layer only */
:root{
  --g:#0b5d4b;--g2:#08463a;--iv:#fbf8ef;--au:#b8975a;
  --tx:#1d2b27;--mu:#64756f;--bd:#e6dfcc;
  --surface:rgba(255,255,255,.88);--shadow:0 14px 40px rgba(8,70,58,.09);
  --shadow-hover:0 20px 48px rgba(8,70,58,.15);--radius:22px;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at 0% 0%,rgba(184,151,90,.10),transparent 32rem),
    radial-gradient(ellipse at 100% 10%,rgba(11,93,75,.09),transparent 34rem),
    var(--iv)!important;
  color:var(--tx);font-family:"Cairo",Tahoma,Arial,sans-serif;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.20;
  background-image:url("data:image/svg+xml,%3Csvg width='96' height='96' viewBox='0 0 96 96' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23b8975a' stroke-opacity='.30' stroke-width='.7'%3E%3Cpath d='M48 3 61 16 80 16 80 35 93 48 80 61 80 80 61 80 48 93 35 80 16 80 16 61 3 48 16 35 16 16 35 16Z'/%3E%3Cpath d='M48 18 59 29 67 29 67 37 78 48 67 59 67 67 59 67 48 78 37 67 29 67 29 59 18 48 29 37 29 29 37 29Z'/%3E%3C/g%3E%3C/svg%3E");
}
.top, .topbar{
  background:linear-gradient(115deg,#073e33 0%,#0b5d4b 58%,#124f40 100%)!important;
  color:#fff!important;border:0!important;box-shadow:0 8px 30px rgba(8,70,58,.14);
  position:relative;
}
.top:after,.topbar:after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.13;
  background-image:repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,255,255,.2) 23px,transparent 24px 46px);
}
.brand,.brand b,.topbar .brand{color:#fff!important;position:relative;z-index:1}
.brand small{color:#e7d4a5!important}
.top-actions,.top-link{position:relative;z-index:1}
.top-actions>span{color:#f7f2e6}
.wrap{max-width:1180px!important;margin:34px auto!important;padding-left:22px!important;padding-right:22px!important}
.page-title{margin-bottom:26px!important}
h1{letter-spacing:-.035em;color:var(--g)}
h2,h3{letter-spacing:-.02em}
.eyebrow{letter-spacing:.02em}
.card,.action-card{
  background:var(--surface)!important;border:1px solid rgba(184,151,90,.25)!important;
  border-radius:var(--radius)!important;box-shadow:var(--shadow)!important;
  backdrop-filter:blur(10px);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
  position:relative;overflow:hidden;
}
.card:before,.action-card:before{
  content:"";position:absolute;top:0;right:22px;width:54px;height:3px;
  background:linear-gradient(90deg,var(--au),#e4d4a8);border-radius:0 0 8px 8px;opacity:.8;
}
.card:hover,.action-card:hover{box-shadow:var(--shadow-hover)!important;border-color:rgba(184,151,90,.48)!important}
.grid{gap:18px!important}
.btn,.btn-light,.top-link,button{
  border-radius:13px;transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}
.btn{
  background:linear-gradient(135deg,var(--g),var(--g2))!important;color:#fff!important;
  box-shadow:0 5px 13px rgba(11,93,75,.14);font-weight:700;
}
.btn:hover,button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(11,93,75,.16)}
.btn.light,.btn-light{
  background:rgba(255,255,255,.82)!important;color:var(--g)!important;
  border:1px solid rgba(184,151,90,.38)!important;box-shadow:none;
}
.btn.light:hover,.btn-light:hover{background:#f3eee0!important}
input,textarea,select{
  border:1px solid #ded7c5!important;border-radius:13px!important;background:rgba(255,255,255,.92)!important;
  color:var(--tx)!important;outline:none;transition:border-color .18s,box-shadow .18s;
}
input:focus,textarea:focus,select:focus{border-color:var(--g)!important;box-shadow:0 0 0 4px rgba(11,93,75,.09)}
.badge,.room-status{background:#e7f1eb!important;color:#0b5d4b!important;border:1px solid #d1e4d8}
.empty{background:rgba(255,255,255,.76)!important;border:1px dashed rgba(184,151,90,.6)!important;border-radius:18px!important}
.lyrics{background:rgba(255,255,255,.88)!important;border:1px solid rgba(184,151,90,.28)!important;border-radius:22px!important;box-shadow:var(--shadow);padding:clamp(20px,4vw,34px)!important}
.toast{box-shadow:0 12px 32px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.25)}
a:focus-visible,button:focus-visible{outline:3px solid #d9bc7b;outline-offset:3px}
::selection{background:#d9e9df;color:#08463a}
@media(max-width:700px){
  .wrap{margin:22px auto!important;padding-left:14px!important;padding-right:14px!important}
  .top,.topbar{padding:14px 16px!important}
  .top-actions{gap:8px!important}
  .top-actions .btn,.top-actions .top-link{font-size:.88rem;padding:8px 11px}
  .card,.action-card{border-radius:18px!important;padding:17px!important}
  .page-title{gap:10px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

</style>
</head>

<body>
  <div id="app">جارٍ تحميل لوحة القائد...</div>

  <script>
  (async () => {
    const ctx = await requireSession();
    if (!ctx) return;

    if (ctx.account.role !== 'leader' && ctx.account.role !== 'admin') {
      location.replace('member.html' + location.search);
      return;
    }

    const room = selectedRoomId();

    if (!room) {
      location.replace('rooms.html');
      return;
    }

    const rooms = await getAllowedRooms(ctx.account.id);
    const currentRoom = rooms.find(r => r.id === room);

    if (!currentRoom) {
      location.replace('rooms.html');
      return;
    }

    document.getElementById('app').innerHTML =
      styles() +
      commonHeader('لوحة القائد', ctx.account) +
      `
      <section class="card" style="margin-bottom:18px">
        <p class="eyebrow">لوحة التحكم</p>
        <p class="muted">الغرفة الحالية</p>
        <h2>${escapeHtml(currentRoom.name)}</h2>

        <p class="muted">
          من هنا يمكنك متابعة الأنشودة المعتمدة وتغييرها من الفهرس العام.
        </p>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
          <a
            class="btn"
            href="library.html?room=${encodeURIComponent(room)}"
          >
            اختيار أنشودة
          </a>

          <a class="btn light" href="rooms.html">
            تغيير الغرفة
          </a>
        </div>
      </section>

      <section id="active" class="card" aria-live="polite">
        <div class="empty">جارٍ تحميل الأنشودة الحالية...</div>
      </section>
      </main>
      `;

    const activeElement = document.getElementById('active');
    let loading = false;

    // تحميل الأنشودة النشطة للغرفة الحالية
    async function load() {
      if (loading) return;
      loading = true;

      try {
        const { data, error } = await db
          .from('active_selections')
          .select('nasheed_id,selected_at,anasheed(id,title,content)')
          .eq('room_id', room)
          .maybeSingle();

        if (error) throw error;

        if (!data || !data.anasheed) {
          activeElement.innerHTML = `
            <div class="empty">
              <h2>لا توجد أنشودة معتمدة حاليًا</h2>
              <p>اختر أنشودة من الفهرس لتظهر للمنشدين في هذه الغرفة.</p>

              <a
                class="btn"
                href="library.html?room=${encodeURIComponent(room)}"
              >
                اختيار أنشودة الآن
              </a>
            </div>
          `;
          return;
        }

        const selectedTime = data.selected_at
          ? new Date(data.selected_at).toLocaleString('ar-JO')
          : 'غير متوفر';

        activeElement.innerHTML = `
          <div style="text-align:center;padding:12px 4px">
            <span class="badge">الأنشودة النشطة</span>

            <p class="eyebrow" style="margin-top:20px">
              الأنشودة المعتمدة للغرفة
            </p>

            <h2 style="font-size:1.6rem;line-height:1.8">
              ${escapeHtml(data.anasheed.title)}
            </h2>

            <p class="muted">
              وقت الاعتماد: ${escapeHtml(selectedTime)}
            </p>

            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">
              <a
                class="btn"
                href="nasheed.html?id=${encodeURIComponent(data.nasheed_id)}&room=${encodeURIComponent(room)}"
              >
                عرض كلمات الأنشودة
              </a>

              <button class="btn light" id="clear" type="button">
                إلغاء الاختيار
              </button>
            </div>
          </div>
        `;

        // إلغاء الأنشودة النشطة
        document.getElementById('clear').onclick = async () => {
          


          const btn = document.getElementById('clear');
          btn.disabled = true;
          btn.textContent = 'جارٍ الإلغاء...';

          try {
            const { error } = await db.rpc(
              'clear_nasheed_for_room',
              { p_room_id: room }
            );

            if (error) throw error;

            toast('تم إلغاء الاختيار');
            await load();
          } catch (err) {
            console.error('خطأ إلغاء الاختيار:', err);
            toast(
              'تعذّر إلغاء الاختيار. تحقق من صلاحيات الحساب ودالة قاعدة البيانات.',
              true
            );

            btn.disabled = false;
            btn.textContent = 'إلغاء الاختيار';
          }
        };
      } catch (err) {
        console.error('خطأ تحميل الأنشودة:', err);

        activeElement.innerHTML = `
          <div class="empty">
            <p>تعذّر تحميل الأنشودة الحالية.</p>
            <button class="btn" id="retryLoad" type="button">
              إعادة المحاولة
            </button>
          </div>
        `;

        document.getElementById('retryLoad').onclick = () => {
          load();
        };
      } finally {
        loading = false;
      }
    }

    // التحميل الأول
    await load();

    // تحديث مباشر عند تغيير الأنشودة في الغرفة
    const channel = db
      .channel('leader-room-' + room)
      .on(
        'postgres_changes',
        {
          event: '*',
          schema: 'public',
          table: 'active_selections',
          filter: 'room_id=eq.' + room
        },
        () => {
          load();
        }
      )
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          load();
        }
      });

    // تنظيف الاتصال عند مغادرة الصفحة
    window.addEventListener('beforeunload', () => {
      db.removeChannel(channel);
    });
  })();
  </script>
</body>
</html>

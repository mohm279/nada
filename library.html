
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>فهرس الأناشيد | نَدى</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared.js"></script>

  <style>
    .library-tools {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .library-tools input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d8dfd7;
      border-radius: 10px;
      font: inherit;
    }

    .maqam-filter {
      position: relative;
      width: 100%;
    }

    .maqam-filter > button {
      width: 100%;
      padding: 12px;
      text-align: right;
      font: inherit;
      cursor: pointer;
    }

    .maqam-menu {
      margin-top: 8px;
      padding: 8px;
      background: #fff;
      border: 1px solid #d8dfd7;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
      max-height: 260px;
      overflow-y: auto;
    }

    .maqam-menu[hidden] {
      display: none;
    }

    .maqam-menu button {
      display: block;
      width: 100%;
      padding: 11px;
      border: 0;
      background: transparent;
      text-align: right;
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
    }

    .maqam-menu button:hover,
    .maqam-menu button.active {
      background: #e7f1eb;
      color: #0b5d4b;
      font-weight: 800;
    }

    .pagination {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 18px 0;
    }

    .pagination button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .pagination .current-page {
      background: #0b5d4b;
      color: #fff;
      border: 1px solid #0b5d4b;
    }

    .page-info {
      text-align: center;
      color: #64756d;
      font-size: 14px;
      margin: 8px 0;
    }

    /* نموذج اقتراح الأنشودة */
    .suggestion-form {
      display: grid;
      gap: 10px;
    }

    .suggestion-form input,
    .suggestion-form textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font: inherit;
    }

    .suggestion-form textarea {
      resize: vertical;
      min-height: 150px;
    }

    .suggestion-form label {
      font-weight: 700;
      margin-top: 5px;
    }

    .suggestion-form button:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }
  </style>

  <style id="nada-geometric-heritage">
    :root{
      --g:#0b5d4b;--g2:#08463a;--iv:#fbf8ef;--au:#b8975a;
      --tx:#1d2b27;--mu:#64756f;--bd:#e6dfcc;
      --surface:rgba(255,255,255,.88);--shadow:0 14px 40px rgba(8,70,58,.09);
      --shadow-hover:0 20px 48px rgba(8,70,58,.15);--radius:22px;
    }

    html{scroll-behavior:smooth}

    body{
      background:
        radial-gradient(ellipse at 0% 0%,rgba(184,151,90,.10),transparent 32rem),
        radial-gradient(ellipse at 100% 10%,rgba(11,93,75,.09),transparent 34rem),
        var(--iv)!important;
      color:var(--tx);font-family:"Cairo",Tahoma,Arial,sans-serif;
    }

    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.20;
      background-image:url("data:image/svg+xml,%3Csvg width='96' height='96' viewBox='0 0 96 96' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23b8975a' stroke-opacity='.30' stroke-width='.7'%3E%3Cpath d='M48 3 61 16 80 16 80 35 93 48 80 61 80 80 61 80 48 93 35 80 16 80 16 61 3 48 16 35 16 16 35 16Z'/%3E%3Cpath d='M48 18 59 29 67 29 67 37 78 48 67 59 67 67 59 67 48 78 37 67 29 67 29 59 18 48 29 37 29 29 37 29Z'/%3E%3C/g%3E%3C/svg%3E");
    }

    .top, .topbar{
      background:linear-gradient(115deg,#073e33 0%,#0b5d4b 58%,#124f40 100%)!important;
      color:#fff!important;border:0!important;box-shadow:0 8px 30px rgba(8,70,58,.14);
      position:relative;
    }

    .top:after,.topbar:after{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.13;
      background-image:repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,255,255,.2) 23px,transparent 24px 46px);
    }

    .brand,.brand b,.topbar .brand{color:#fff!important;position:relative;z-index:1}
    .brand small{color:#e7d4a5!important}
    .top-actions,.top-link{position:relative;z-index:1}
    .top-actions>span{color:#f7f2e6}

    .wrap{max-width:1180px!important;margin:34px auto!important;padding-left:22px!important;padding-right:22px!important}
    .page-title{margin-bottom:26px!important}
    h1{letter-spacing:-.035em;color:var(--g)}
    h2,h3{letter-spacing:-.02em}
    .eyebrow{letter-spacing:.02em}

    .card,.action-card{
      background:var(--surface)!important;border:1px solid rgba(184,151,90,.25)!important;
      border-radius:var(--radius)!important;box-shadow:var(--shadow)!important;
      backdrop-filter:blur(10px);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
      position:relative;overflow:hidden;
    }

    .card:before,.action-card:before{
      content:"";position:absolute;top:0;right:22px;width:54px;height:3px;
      background:linear-gradient(90deg,var(--au),#e4d4a8);border-radius:0 0 8px 8px;opacity:.8;
    }

    .card:hover,.action-card:hover{box-shadow:var(--shadow-hover)!important;border-color:rgba(184,151,90,.48)!important}
    .grid{gap:18px!important}

    .btn,.btn-light,.top-link,button{
      border-radius:13px;transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
    }

    .btn{
      background:linear-gradient(135deg,var(--g),var(--g2))!important;color:#fff!important;
      box-shadow:0 5px 13px rgba(11,93,75,.14);font-weight:700;
    }

    .btn:hover,button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(11,93,75,.16)}

    .btn.light,.btn-light{
      background:rgba(255,255,255,.82)!important;color:var(--g)!important;
      border:1px solid rgba(184,151,90,.38)!important;box-shadow:none;
    }

    .btn.light:hover,.btn-light:hover{background:#f3eee0!important}

    input,textarea,select{
      border:1px solid #ded7c5!important;border-radius:13px!important;background:rgba(255,255,255,.92)!important;
      color:var(--tx)!important;outline:none;transition:border-color .18s,box-shadow .18s;
    }

    input:focus,textarea:focus,select:focus{border-color:var(--g)!important;box-shadow:0 0 0 4px rgba(11,93,75,.09)}
    .badge,.room-status{background:#e7f1eb!important;color:#0b5d4b!important;border:1px solid #d1e4d8}
    .empty{background:rgba(255,255,255,.76)!important;border:1px dashed rgba(184,151,90,.6)!important;border-radius:18px!important}
    .lyrics{background:rgba(255,255,255,.88)!important;border:1px solid rgba(184,151,90,.28)!important;border-radius:22px!important;box-shadow:var(--shadow);padding:clamp(20px,4vw,34px)!important}
    .toast{box-shadow:0 12px 32px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.25)}
    a:focus-visible,button:focus-visible{outline:3px solid #d9bc7b;outline-offset:3px}
    ::selection{background:#d9e9df;color:#08463a}

    @media(max-width:700px){
      .wrap{margin:22px auto!important;padding-left:14px!important;padding-right:14px!important}
      .top,.topbar{padding:14px 16px!important}
      .top-actions{gap:8px!important}
      .top-actions .btn,.top-actions .top-link{font-size:.88rem;padding:8px 11px}
      .card,.action-card{border-radius:18px!important;padding:17px!important}
      .page-title{gap:10px}
    }

    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
    }

    /* NADA - PROFESSIONAL LIBRARY ICONS */

    .nada-section-heading {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .nada-heading-icon {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 17px;
      border: 1px solid #c5dbc9;
      color: #167653;
      background: linear-gradient(145deg,#e5f3e8,#c8e5d2);

    }

    .nada-heading-icon svg,
    .nas heed-icon svg {
      width: 27px;
      height: 27px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;

    .nada-heading-icon.gold {

    }

    .nada-heading-icon:hover {
      transform: translateY(-3px);
    }

    .nas heed-icon {
      display: none;
    }

    .nasheed-card {
      position: relative;
    }

    .nasheed-card-heading {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 15px 0;
    }

    .nasheed-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #167653;
      background: linear-gradient(145deg,#e5f3e8,#c8e5d2);
      border: 1px solid #c5dbc9;
      border-radius: 15px;
    }

    .nasheed-icon svg {

    html[data-theme="dark"] .nada-heading-icon {

    html[data-theme="dark"] .nada-heading-icon.gold {

    }

    html[data-theme="dark"] .nasheed-card:hover .nasheed-icon {

    html[data-theme="dark"] .nasheed-card h2 {

    html[data-theme="dark"] .library-tools {

    html[data-theme="dark"] .library-tools label {

    html[data-theme="dark"] .maqam-menu {

    html[data-theme="dark"] .maqam-menu button:hover,

</head>

<body>
  <div id="app">جارٍ تحميل الفهرس...</div>

  <script>
  (async () => {
    const app = document.getElementById('app');

    try {
      let ctx = null;

      const { data: { session } } = await db.auth.getSession();

      if (session) {
        ctx = await requireSession();
      }

      const room = ctx ? selectedRoomId() : null;
      const isAdmin = ctx?.account?.role === 'admin';

      const canSelect =
        !!ctx &&
        (ctx.account.role === 'admin' ||
         ctx.account.role === 'leader');

      const PAGE_SIZE = 25;

      let currentPage = 0;
      let totalCount = 0;
      let searchTimer = null;
      let requestNumber = 0;
      let selectedCategory = null;

      app.innerHTML = styles() +
        commonHeader('فهرس الأناشيد العام', ctx?.account || null) + `

        ${isAdmin ? `
          <section class="card" style="margin-bottom:20px">
            <div class="nada-section-heading">
              <div class="nada-heading-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M12 5v14M5 12h14"/>
                  <circle cx="12" cy="12" r="9"/>
                </svg>
              </div>
              <h2>إضافة أنشودة جديدة</h2>
            </div>

            <p class="muted">
              أضف أنشودة إلى الفهرس العام لتكون متاحة للجميع.
            </p>

            <form id="addNasheedForm">
              <label for="newTitle">عنوان الأنشودة</label>
              <input
                id="newTitle"
                maxlength="250"
                placeholder="اكتب عنوان الأنشودة"
                required
              >

              <label for="newCategory">التصنيف</label>
              <input
                id="newCategory"
                maxlength="150"
                placeholder="مثلاً: بيات، حضرة، البردة، الهمزية"
              >

              <label for="newPoet">اسم الكاتب</label>
              <input
                id="newPoet"
                maxlength="200"
                placeholder="اكتب اسم الكاتب (اختياري)"
              >

              <label for="newContent">كلمات الأنشودة</label>
              <textarea
                id="newContent"
                rows="8"
                placeholder="اكتب كلمات الأنشودة هنا..."
                required
              ></textarea>

              <button class="btn" id="addNasheedBtn" type="submit">
                إضافة الأنشودة
              </button>
            </form>
          </section>
        ` : ''}

        ${ctx ? `
          <section class="card" style="margin-bottom:20px">
            <div class="nada-section-heading">
              <div class="nada-heading-icon gold">
                <svg viewBox="0 0 24 24">
                  <path d="M12 5v14M5 12h14"/>
                  <circle cx="12" cy="12" r="9"/>
                </svg>
              </div>
              <h2>اقترح أنشودة</h2>
            </div>

            <p class="muted">
              شاركنا أنشودة جديدة، وستصل إلى الإدارة لمراجعتها قبل إضافتها إلى الفهرس العام.
            </p>

            <form id="suggestNasheedForm" class="suggestion-form">
              <label for="suggestTitle">عنوان الأنشودة</label>
              <input
                id="suggestTitle"
                maxlength="250"
                placeholder="اكتب عنوان الأنشودة"
                required
              >

              <label for="suggestCategory">التصنيف</label>
              <input
                id="suggestCategory"
                maxlength="150"
                placeholder="مثلاً: بيات، حضرة، البردة"
              >

              <label for="suggestAuthor">اسم الكاتب</label>
              <input
                id="suggestAuthor"
                maxlength="200"
                placeholder="اسم الكاتب (اختياري)"
              >

              <label for="suggestContent">كلمات الأنشودة</label>
              <textarea
                id="suggestContent"
                rows="8"
                maxlength="20000"
                placeholder="اكتب كلمات الأنشودة هنا..."
                required
              ></textarea>

              <button
                class="btn"
                id="suggestNasheedBtn"
                type="submit"
              >
                إرسال الاقتراح للمراجعة
              </button>
            </form>
          </section>
        ` : ''}

        <section class="card library-tools">
          <div class="nada-section-heading">
            <div class="nada-heading-icon gold">
              <svg viewBox="0 0 24 24">
                <path d="M4 5h16M4 12h16M4 19h16"/>
                <circle cx="8" cy="5" r="1"/>
                <circle cx="16" cy="12" r="1"/>
                <circle cx="10" cy="19" r="1"/>
              </svg>
            </div>
            <h2>فهرس الأناشيد</h2>
          </div>

          ${room ? `
            <p class="muted" id="roomName">
              الغرفة المختارة: جارٍ التحميل...
            </p>
          ` : `
            <p class="muted">
              لم تختر غرفة بعد. يمكنك تصفّح الأناشيد،
              لكن اعتماد أنشودة يحتاج إلى اختيار غرفة.
            </p>
          `}

          <label>التصنيفات</label>

          <div class="maqam-filter">
            <button
              type="button"
              id="maqamToggle"
              class="btn light"
              aria-expanded="false"
            >
              التصنيفات: <span id="maqamSelected">كل التصنيفات</span>
            </button>

            <div id="maqamMenu" class="maqam-menu" hidden>
              <button type="button" data-category="" class="active">
                كل التصنيفات
              </button>
            </div>
          </div>

          <label for="q">البحث في الأناشيد</label>

          <input
            id="q"
            type="search"
            placeholder="ابحث بعنوان الأنشودة أو تصنيفها..."
            autocomplete="off"
          >

          <p class="muted" id="count" aria-live="polite">
            جارٍ تحميل الأناشيد...
          </p>
        </section>

        <section id="list" class="grid"></section>

        <div
          id="pagination"
          class="pagination"
          aria-label="صفحات الفهرس"
        ></div>

        <p id="pageInfo" class="page-info"></p>
      </main>`;

      const searchInput = document.getElementById('q');
      const list = document.getElementById('list');
      const count = document.getElementById('count');
      const pagination = document.getElementById('pagination');
      const pageInfo = document.getElementById('pageInfo');

      const maqamToggle = document.getElementById('maqamToggle');
      const maqamMenu = document.getElementById('maqamMenu');
      const maqamSelected = document.getElementById('maqamSelected');

      // تحميل التصنيفات تلقائيًا من قاعدة البيانات
      async function loadMaqamat() {
        const { data, error } = await db
          .from('anasheed')
          .select('category')
          .not('category', 'is', null)
          .order('category', { ascending: true });

        if (error) throw error;

        const categories = [
          ...new Set(
            (data || [])
              .map(item => item.category?.trim())
              .filter(Boolean)
          )
        ];

        maqamMenu.innerHTML = `
          <button
            type="button"
            data-category=""
            class="${selectedCategory ? '' : 'active'}"
          >كل التصنيفات</button>

          ${categories.map(category => `
            <button
              type="button"
              data-category="${escapeHtml(category)}"
              class="${selectedCategory === category ? 'active' : ''}"
            >${escapeHtml(category)}</button>
          `).join('')}
        `;
      }

      // فتح وإغلاق قائمة التصنيف
      maqamToggle.addEventListener('click', () => {
        const isOpening = maqamMenu.hidden;

        maqamMenu.hidden = !isOpening;
        maqamToggle.setAttribute('aria-expanded', String(isOpening));
      });

      // اختيار التصنيف
      maqamMenu.addEventListener('click', async e => {
        const btn = e.target.closest('button[data-category]');

        if (!btn) return;

        selectedCategory = btn.dataset.category || null;

        maqamSelected.textContent =
          selectedCategory || 'كل التصنيفات';

        maqamMenu.querySelectorAll('button').forEach(item => {
          item.classList.toggle('active', item === btn);
        });

        maqamMenu.hidden = true;
        maqamToggle.setAttribute('aria-expanded', 'false');

        currentPage = 0;

        try {
          await loadAnasheed();
        } catch (err) {
          showLoadError(err);
        }
      });

      // إغلاق القائمة عند الضغط خارجها
      document.addEventListener('click', e => {
        if (!e.target.closest('.maqam-filter')) {
          maqamMenu.hidden = true;
          maqamToggle.setAttribute('aria-expanded', 'false');
        }
      });

      // عرض اسم الغرفة المختارة
      if (room) {
        const { data, error } = await db
          .from('rooms')
          .select('name')
          .eq('id', room)
          .maybeSingle();

        const roomName = document.getElementById('roomName');

        if (roomName) {
          roomName.textContent = error
            ? 'الغرفة المختارة'
            : 'الغرفة المختارة: ' + (data?.name || 'غرفة');
        }
      }

      // إضافة أنشودة جديدة - للمدير فقط
      if (isAdmin) {
        document
          .getElementById('addNasheedForm')
          .addEventListener('submit', async e => {
            e.preventDefault();

            const btn =
              document.getElementById('addNasheedBtn');

            const title =
              document.getElementById('newTitle').value.trim();

            const category =
              document.getElementById('newCategory').value.trim();

            const poetName =
              document.getElementById('newPoet').value.trim();

            const content =
              document.getElementById('newContent').value.trim();

            if (!title || !content) {
              toast('عنوان الأنشودة وكلماتها مطلوبان.', true);
              return;
            }

            btn.disabled = true;
            btn.textContent = 'جارٍ إضافة الأنشودة...';

            try {
              const { error } = await db
                .from('anasheed')
                .insert({
                  title,
                  category: category || null,
                  poet_name: poetName || null,
                  content
                });

              if (error) throw error;

              e.target.reset();
              searchInput.value = '';
              currentPage = 0;
              selectedCategory = null;
              maqamSelected.textContent = 'كل التصنيفات';

              await loadMaqamat();
              await loadAnasheed();

              toast('تمت إضافة الأنشودة بنجاح');

              document.getElementById('newTitle').focus();

            } catch (err) {
              console.error('خطأ إضافة الأنشودة:', err);

              toast(
                'تعذّرت إضافة الأنشودة. تحقق من صلاحيات المدير وسياسات قاعدة البيانات.',
                true
              );

            } finally {
              btn.disabled = false;
              btn.textContent = 'إضافة الأنشودة';
            }
          });
      }

      // إرسال اقتراح أنشودة - للمستخدمين المسجلين فقط
      if (ctx) {
        document
          .getElementById('suggestNasheedForm')
          .addEventListener('submit', async e => {
            e.preventDefault();

            const btn =
              document.getElementById('suggestNasheedBtn');

            const title =
              document.getElementById('suggestTitle').value.trim();

            const category =
              document.getElementById('suggestCategory').value.trim();

            const authorName =
              document.getElementById('suggestAuthor').value.trim();

            const content =
              document.getElementById('suggestContent').value.trim();

            if (!title || !content) {
              toast('عنوان الأنشودة وكلماتها مطلوبان.', true);
              return;
            }

            btn.disabled = true;
            btn.textContent = 'جارٍ إرسال الاقتراح...';

            try {
              const { error } = await db
                .from('nasheed_suggestions')
                .insert({
                  title,
                  category: category || null,
                  author_name: authorName || null,
                  content,
                  submitted_by: ctx.account.id,
                  status: 'pending'
                });

              if (error) throw error;

              e.target.reset();

              toast('تم إرسال اقتراحك بنجاح، وهو الآن قيد المراجعة.');

            } catch (err) {
              console.error('خطأ إرسال اقتراح الأنشودة:', err);

              toast(
                'تعذّر إرسال الاقتراح. قد تكون صلاحيات قاعدة البيانات غير مكتملة.',
                true
              );

            } finally {
              btn.disabled = false;
              btn.textContent = 'إرسال الاقتراح للمراجعة';
            }
          });
      }

      // إنشاء أزرار التنقل بين الصفحات
      function renderPagination() {
        const pages = Math.max(
          1,
          Math.ceil(totalCount / PAGE_SIZE)
        );

        if (pages <= 1) {
          pagination.innerHTML = '';
          pageInfo.textContent =
            totalCount ? 'الصفحة 1 من 1' : '';
          return;
        }

        const start = Math.max(
          0,
          Math.min(currentPage - 2, pages - 5)
        );

        const end = Math.min(pages, start + 5);

        let buttons = `
          <button
            class="btn light"
            data-page="0"
            ${currentPage === 0 ? 'disabled' : ''}
          >الأولى</button>

          <button
            class="btn light"
            data-page="${currentPage - 1}"
            ${currentPage === 0 ? 'disabled' : ''}
          >السابق</button>
        `;

        for (let p = start; p < end; p++) {
          buttons += `
            <button
              class="btn ${p === currentPage
                ? 'current-page'
                : 'light'}"
              data-page="${p}"
              ${p === currentPage
                ? 'aria-current="page"'
                : ''}
            >${p + 1}</button>
          `;
        }

        buttons += `
          <button
            class="btn light"
            data-page="${currentPage + 1}"
            ${currentPage >= pages - 1 ? 'disabled' : ''}
          >التالي</button>

          <button
            class="btn light"
            data-page="${pages - 1}"
            ${currentPage >= pages - 1 ? 'disabled' : ''}
          >الأخيرة</button>
        `;

        pagination.innerHTML = buttons;

        pageInfo.textContent =
          `الصفحة ${currentPage + 1} من ${pages}`;
      }

      // تحميل الأناشيد مع فلتر التصنيف والبحث
      async function loadAnasheed() {
        const myRequest = ++requestNumber;

        count.textContent = 'جارٍ تحميل الأناشيد...';
        list.innerHTML = '';
        pagination.innerHTML = '';
        pageInfo.textContent = '';

        const { data, error } = await db.rpc(
          'search_anasheed',
          {
            p_search: searchInput.value.trim() || null,
            p_offset: currentPage * PAGE_SIZE,
            p_limit: PAGE_SIZE,
            p_category: selectedCategory || null
          }
        );

        if (error) throw error;

        // تجاهل نتيجة بحث قديم إذا وصل بحث أحدث
        if (myRequest !== requestNumber) return;

        const rows = data || [];

        totalCount = rows.length
          ? Number(rows[0].total_count)
          : 0;

        const pages = Math.max(
          1,
          Math.ceil(totalCount / PAGE_SIZE)
        );

        if (currentPage >= pages) {
          currentPage = pages - 1;

          if (currentPage < 0) currentPage = 0;

          return loadAnasheed();
        }

        count.textContent = searchInput.value.trim()
          ? `النتائج: ${totalCount} — يعرض ${rows.length} أنشودة في هذه الصفحة`
          : `عدد الأناشيد: ${totalCount} — يعرض ${rows.length} أنشودة في هذه الصفحة`;

        if (!rows.length) {
          list.innerHTML = `
            <div class="empty">
              ${searchInput.value.trim() || selectedCategory
                ? 'ما لقينا أناشيد مطابقة لاختياراتك.'
                : 'لا توجد أناشيد مضافة حتى الآن.'}
            </div>
          `;

          renderPagination();
          return;
        }

        list.innerHTML = rows.map((n, i) => `
          <article class="card nasheed-card">

            <span class="muted">
              أنشودة ${currentPage * PAGE_SIZE + i + 1}
            </span>

            <div class="nasheed-card-heading">
              <span class="nasheed-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path
                    d="M9 18V5l12-2v13"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle cx="6" cy="18" r="3"
                    stroke="currentColor" stroke-width="1.8"/>
                  <circle cx="18" cy="16" r="3"
                    stroke="currentColor" stroke-width="1.8"/>
                </svg>
              </span>

              <h2>${escapeHtml(n.title || 'بدون عنوان')}</h2>
            </div>

            <p class="muted">
              التصنيف: ${escapeHtml(n.category || 'غير محدد')}
            </p>

            ${n.poet_name ? `
              <p class="muted">
                ✍️ الكاتب: <strong>${escapeHtml(n.poet_name)}</strong>
              </p>
            ` : ''}

            <div
              style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"
            >
              <a
                class="btn"
                href="nasheed.html?id=${encodeURIComponent(n.id)}${room ? '&room=' + encodeURIComponent(room) : ''}"
              >عرض الأنشودة</a>

              ${canSelect && room ? `
                <button
                  class="btn light select-btn"
                  type="button"
                  data-id="${escapeHtml(n.id)}"
                >اعتماد للفرقة</button>
              ` : ''}
            </div>

          </article>
        `).join('');

        renderPagination();
      }

      // التنقل بين الصفحات
      pagination.addEventListener('click', async e => {
        const btn = e.target.closest('button[data-page]');

        if (!btn || btn.disabled) return;

        const next = Number(btn.dataset.page);

        const pages = Math.max(
          1,
          Math.ceil(totalCount / PAGE_SIZE)
        );

        if (
          !Number.isInteger(next) ||
          next < 0 ||
          next >= pages ||
          next === currentPage
        ) {
          return;
        }

        currentPage = next;

        try {
          await loadAnasheed();
        } catch (err) {
          showLoadError(err);
        }
      });

      // اعتماد أنشودة للغرفة المختارة
      list.addEventListener('click', async e => {
        const btn = e.target.closest('.select-btn');

        if (!btn) return;

        const nasheedId = btn.dataset.id;

        if (!room || !nasheedId) {
          toast('اختر غرفة أولًا.', true);
          return;
        }

        btn.disabled = true;
        btn.textContent = 'جارٍ الاعتماد...';

        try {
          const { error } = await db.rpc(
            'select_nasheed_for_room',
            {
              p_room_id: room,
              p_nasheed_id: nasheedId
            }
          );

          if (error) throw error;

          toast('تم اعتماد الأنشودة للفرقة بنجاح');

        } catch (err) {
          console.error('خطأ اعتماد الأنشودة:', err);

          toast(
            'تعذّر الاعتماد. تحقق من صلاحيات الحساب ودالة قاعدة البيانات.',
            true
          );

        } finally {
          btn.disabled = false;
          btn.textContent = 'اعتماد للفرقة';
        }
      });

      // البحث مع تأخير بسيط لتقليل الطلبات
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);

        searchTimer = setTimeout(() => {
          currentPage = 0;

          loadAnasheed().catch(showLoadError);
        }, 300);
      });

      // عرض خطأ التحميل مع زر لإعادة المحاولة
      function showLoadError(err) {
        console.error('خطأ تحميل الفهرس:', err);

        count.textContent = 'تعذّر تحميل الأناشيد.';

        list.innerHTML = `
          <div class="empty">
            تعذّر تحميل الفهرس. تحقق من الاتصال وصلاحيات القراءة.

            <button class="btn" id="retry" type="button">
              إعادة المحاولة
            </button>
          </div>
        `;

        pagination.innerHTML = '';

        document.getElementById('retry').onclick =
          async () => {
            const btn = document.getElementById('retry');

            btn.disabled = true;
            btn.textContent = 'جارٍ إعادة المحاولة...';

            try {
              await loadMaqamat();
              await loadAnasheed();
            } catch (e) {
              showLoadError(e);
            }
          };
      }

      // تحميل التصنيفات ثم الأناشيد عند فتح الصفحة
      try {
        await loadMaqamat();
        await loadAnasheed();
      } catch (err) {
        showLoadError(err);
      }

    } catch (err) {
      console.error('خطأ صفحة الفهرس:', err);

      app.innerHTML = styles() + `
        <main class="wrap">
          <div class="empty">
            تعذّر فتح فهرس الأناشيد.
            تحقق من تسجيل الدخول والاتصال.
          </div>
        </main>
      `;
    }
  })();
  </script>
</body>
</html>
